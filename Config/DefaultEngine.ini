[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; The sky's color (day, storm, night) tints the fog too, so distant jungle fades into the right color.
r.SupportSkyAtmosphereAffectsHeightFog=True
; Software Lumen: realistic bounce light and reflections that still run well on an RTX 3060.
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
; Temporal Super Resolution: sharp edges on thin things like rain and leaves.
r.AntiAliasingMethod=4
; Nanite, for the detailed Megascans rock models.
r.Nanite.ProjectEnabled=True
; Electric Dreams art needs virtual textures and Substrate materials.
r.VirtualTextures=True
r.Substrate=True

